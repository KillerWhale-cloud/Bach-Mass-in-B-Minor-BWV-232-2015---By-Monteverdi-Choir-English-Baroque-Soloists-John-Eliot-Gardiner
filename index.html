<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J. S. Bach — Mass in B Minor, BWV 232</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3ead8;
    color: #3b2c25;
    font-family: Georgia, "Times New Roman", serif;
}

/* Dedication */

.dedication {
    position: absolute;
    top: 18px;
    left: 20px;
    color: #713d35;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11px;
    letter-spacing: 0.5px;
}

/* Main container */

.container {
    max-width: 780px;
    margin: auto;
    padding: 60px 18px 70px;
}

/* Header */

.header {
    text-align: center;
    margin-bottom: 50px;
}

.composer {
    color: #80604f;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 18px;
}

h1 {
    font-size: 34px;
    font-weight: normal;
    margin: 0;
    color: #392923;
}

.subtitle {
    margin-top: 12px;
    color: #705448;
    font-size: 15px;
}

.year {
    margin-top: 6px;
    color: #927666;
    font-size: 13px;
}

.divider {
    width: 70px;
    height: 1px;
    background: #9a7560;
    margin: 25px auto 0;
}

/* Sections */

.section {
    margin-top: 40px;
}

.section-title {
    color: #713d35;
    font-size: 21px;
    font-weight: normal;
    border-bottom: 1px solid #d5c5ad;
    padding-bottom: 8px;
    margin-bottom: 16px;
}

.subsection {
    color: #80604f;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 22px 0 10px;
}

/* Tracks */

.track {
    background: rgba(255, 251, 242, 0.65);
    border: 1px solid #ded0ba;
    border-radius: 7px;
    padding: 13px;
    margin-bottom: 9px;
}

.track-title {
    display: flex;
    gap: 12px;
    align-items: baseline;
    margin-bottom: 8px;
}

.number {
    color: #987463;
    font-size: 13px;
    min-width: 25px;
}

.name {
    color: #3d2c25;
    font-size: 16px;
}

audio {
    display: block;
    width: 100%;
    height: 38px;
}

/* Footer */

.footer {
    text-align: center;
    margin-top: 55px;
    padding-top: 25px;
    border-top: 1px solid #d5c5ad;
    color: #927666;
    font-size: 13px;
    line-height: 1.8;
}

/* Mobile */

@media (max-width: 600px) {

    .container {
        padding: 50px 14px 55px;
    }

    h1 {
        font-size: 27px;
    }

    .section-title {
        font-size: 19px;
    }

    .name {
        font-size: 15px;
    }

    .dedication {
        top: 14px;
        left: 15px;
        font-size: 10px;
    }
}

</style>
</head>

<body>

<div class="dedication">
    From Hedgehog to Cactus
</div>


<div class="container">

<header class="header">

    <div class="composer">
        Johann Sebastian Bach
    </div>

    <h1>
        Mass in B Minor
    </h1>

    <div class="subtitle">
        BWV 232
    </div>

    <div class="subtitle">
        Monteverdi Choir · English Baroque Soloists
    </div>

    <div class="subtitle">
        John Eliot Gardiner
    </div>

    <div class="year">
        2015
    </div>

    <div class="divider"></div>

</header>


<div id="music"></div>


<footer class="footer">

    J. S. Bach · Mass in B Minor, BWV 232<br>

    Monteverdi Choir · English Baroque Soloists<br>

    John Eliot Gardiner · 2015

</footer>

</div>

    {

    },

    {
        number: "25",
        section: "VII. Dona nobis pacem",
        subsection: "",
        title: "Coro — Dona nobis pacem",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Dona_nobis_pacem.mp3"
    }

];


const music = document.getElementById("music");

let currentSection = "";
let currentSubsection = "";
let currentSectionElement = null;


tracks.forEach(track => {

    if (track.section !== currentSection) {

        currentSection = track.section;
        currentSubsection = "";

        currentSectionElement = document.createElement("section");
        currentSectionElement.className = "section";

        const heading = document.createElement("h2");
        heading.className = "section-title";
        heading.textContent = track.section;

        currentSectionElement.appendChild(heading);
        music.appendChild(currentSectionElement);
    }


    if (
        track.subsection &&
        track.subsection !== currentSubsection
    ) {

        currentSubsection = track.subsection;

        const subheading = document.createElement("div");
        subheading.className = "subsection";
        subheading.textContent = track.subsection;

        currentSectionElement.appendChild(subheading);
    }


    const trackBox = document.createElement("div");
    trackBox.className = "track";


    const titleBox = document.createElement("div");
    titleBox.className = "track-title";


    const number = document.createElement("span");
    number.className = "number";
    number.textContent = track.number;


    const name = document.createElement("span");
    name.className = "name";
    name.textContent = track.title;


    titleBox.appendChild(number);
    titleBox.appendChild(name);


    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";


    const source = document.createElement("source");

    source.src = encodeURI(track.file);
    source.type = "audio/mpeg";


    audio.appendChild(source);

    trackBox.appendChild(titleBox);
    trackBox.appendChild(audio);

    currentSectionElement.appendChild(trackBox);

});

</script>

</body>
  </html>
