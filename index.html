<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J. S. Bach — Mass in B Minor, BWV 232</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3ead8;
    color: #3b2c25;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* Dedication */

.dedication {
    position: absolute;
    top: 18px;
    left: 20px;
    color: #713d35;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    font-weight: normal;
    letter-spacing: 0.3px;
}

.star {
    font-weight: 700;
}

/* Main container */

.container {
    max-width: 780px;
    margin: auto;
    padding: 60px 18px 70px;
}

/* Header */

.header {
    text-align: center;
    margin-bottom: 50px;
    padding: 30px 24px 28px;

    background-color: #eadcc4;

    background-image:
        linear-gradient(
            167deg,
            transparent 0%,
            transparent 13%,
            rgba(126, 89, 60, 0.045) 14%,
            rgba(126, 89, 60, 0.055) 16%,
            transparent 18%,
            transparent 31%,
            rgba(126, 89, 60, 0.035) 32%,
            rgba(126, 89, 60, 0.045) 34%,
            transparent 36%,
            transparent 49%,
            rgba(126, 89, 60, 0.04) 50%,
            rgba(126, 89, 60, 0.05) 52%,
            transparent 54%,
            transparent 67%,
            rgba(126, 89, 60, 0.035) 68%,
            rgba(126, 89, 60, 0.045) 70%,
            transparent 72%,
            transparent 85%,
            rgba(126, 89, 60, 0.04) 86%,
            rgba(126, 89, 60, 0.05) 88%,
            transparent 90%
        ),
        linear-gradient(
            173deg,
            transparent 0%,
            transparent 22%,
            rgba(111, 78, 52, 0.025) 23%,
            rgba(111, 78, 52, 0.04) 25%,
            transparent 27%,
            transparent 43%,
            rgba(111, 78, 52, 0.03) 44%,
            rgba(111, 78, 52, 0.04) 46%,
            transparent 48%,
            transparent 64%,
            rgba(111, 78, 52, 0.025) 65%,
            rgba(111, 78, 52, 0.04) 67%,
            transparent 69%,
            transparent 82%,
            rgba(111, 78, 52, 0.03) 83%,
            rgba(111, 78, 52, 0.04) 85%,
            transparent 87%
        );

    background-size:
        100% 100%,
        100% 100%;

    border: 3px solid #80604f;
}

.composer {
    color: #6f5142;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 18px;
}

h1 {
    font-size: 34px;
    font-weight: normal;
    margin: 0;
    color: #33241f;
}

.subtitle {
    margin-top: 12px;
    color: #65493d;
    font-size: 15px;
}

.subtitle.gardiner {
    font-weight: 500;
}

.year {
    margin-top: 6px;
    color: #795e50;
    font-size: 13px;
}

.divider {
    width: 70px;
    height: 1px;
    background: #80604f;
    margin: 25px auto 0;
}

/* Sections */

.section {
    margin-top: 40px;
}

.section-title {
    color: #713d35;
    font-size: 21px;
    font-weight: normal;
    border-bottom: 1px solid #d5c5ad;
    padding-bottom: 8px;
    margin-bottom: 16px;
}

.subsection {
    color: #80604f;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 22px 0 10px;
}

/* Tracks */

.track {
    background: rgba(255, 251, 242, 0.65);
    border: 1px solid #ded0ba;
    border-radius: 7px;
    padding: 13px;
    margin-bottom: 9px;
}

.track-title {
    display: flex;
    gap: 12px;
    align-items: baseline;
    margin-bottom: 8px;
}

.number {
    color: #987463;
    font-size: 13px;
    min-width: 25px;
}

.name {
    color: #3d2c25;
    font-size: 16px;
}


/* Custom Classic Audio Player */

.custom-player {
    width: 100%;
    height: 32px;

    background: #ece3d3;

    border: 1px solid #cbb89d;

    border-radius: 999px;

    display: flex;
    align-items: center;

    padding: 0 9px;
    gap: 9px;
}


/* Play Button */

.play-button {
    width: 22px;
    height: 22px;

    border: 1px solid #9a7560;
    border-radius: 50%;

    background: #f3ead8;
    color: #713d35;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    padding: 0;

    flex-shrink: 0;

    -webkit-appearance: none;
    appearance: none;

    -webkit-tap-highlight-color: transparent;

    font-size: 0;
    line-height: 0;

    position: relative;
}


/* Play icon */

.play-button::before {
    content: "";

    width: 0;
    height: 0;

    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 7px solid #713d35;

    margin-left: 2px;
}


/* Pause icon */

.play-button.playing::before {
    content: "";

    width: 7px;
    height: 9px;

    border: none;

    margin-left: 0;

    background:
        linear-gradient(
            to right,
            #713d35 0 2px,
            transparent 2px 5px,
            #713d35 5px 7px
        );
}


.progress-container {
    flex: 1;
    height: 3px;

    background: #cbb89d;

    cursor: pointer;
    position: relative;

    border-radius: 999px;
}

.progress {
    height: 100%;
    width: 0%;

    background: #713d35;

    border-radius: 999px;
}

.time {
    color: #80604f;
    font-size: 11px;
    min-width: 75px;

    text-align: right;

    font-family: Georgia, "Times New Roman", serif;
}

/* Footer */

.footer {
    text-align: center;
    margin-top: 55px;
    padding-top: 25px;

    border-top: 1px solid #d5c5ad;

    color: #927666;
    font-size: 13px;
    line-height: 1.8;
}

/* Mobile */

@media (max-width: 600px) {

    .container {
        padding: 50px 14px 55px;
    }

    h1 {
        font-size: 27px;
    }

    .section-title {
        font-size: 19px;
    }

    .name {
        font-size: 15px;
    }

    .dedication {
        top: 14px;
        left: 15px;
        font-size: 9px;
    }

    .time {
        min-width: 70px;
        font-size: 10px;
    }

    .custom-player {
        gap: 8px;
        padding: 0 8px;
        border-radius: 999px;
    }

    .header {
        padding: 25px 18px 24px;
        border-width: 3px;
    }

}

</style>
</head>

<body>

<div class="dedication">
    From Hedgehog to Cactus <span class="star">☆</span>
</div>


<div class="container">

<header class="header">

    <div class="composer">
        Johann Sebastian Bach
    </div>

    <h1>
