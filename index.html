<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J. S. Bach — Mass in B Minor, BWV 232</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3ead8;
    color: #3b2c25;
    font-family: Georgia, "Times New Roman", serif;
}

/* Dedication */

.dedication {
    position: absolute;
    top: 18px;
    left: 20px;
    color: #713d35;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    font-weight: normal;
    letter-spacing: 0.3px;
}

.star {
    font-weight: 700;
}

/* Main container */

.container {
    max-width: 780px;
    margin: auto;
    padding: 60px 18px 70px;
}

/* Header */

.header {
    text-align: center;
    margin-bottom: 50px;
    padding: 30px 24px 28px;

    background-color: #eadcc4;

    /* Warm aged-paper texture */
    background-image:
        radial-gradient(
            circle at 18% 22%,
            rgba(120, 82, 52, 0.045) 0,
            rgba(120, 82, 52, 0.045) 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 72% 68%,
            rgba(105, 72, 45, 0.035) 0,
            rgba(105, 72, 45, 0.035) 1px,
            transparent 2px
        ),
        linear-gradient(
            rgba(255, 248, 232, 0.18),
            rgba(126, 89, 58, 0.025)
        );

    background-size:
        17px 17px,
        23px 23px,
        100% 100%;

    border: 3px solid #80604f;
}

.composer {
    color: #6f5142;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 18px;
}

h1 {
    font-size: 34px;
    font-weight: normal;
    margin: 0;
    color: #33241f;
}

.subtitle {
    margin-top: 12px;
    color: #65493d;
    font-size: 15px;
}

.subtitle.gardiner {
    font-weight: 500;
}

.year {
    margin-top: 6px;
    color: #795e50;
    font-size: 13px;
}

.divider {
    width: 70px;
    height: 1px;
    background: #80604f;
    margin: 25px auto 0;
}

/* Sections */

.section {
    margin-top: 40px;
}

.section-title {
    color: #713d35;
    font-size: 21px;
    font-weight: normal;
    border-bottom: 1px solid #d5c5ad;
    padding-bottom: 8px;
    margin-bottom: 16px;
}

.subsection {
    color: #80604f;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 22px 0 10px;
}

/* Tracks */

.track {
    background: rgba(255, 251, 242, 0.65);
    border: 1px solid #ded0ba;
    border-radius: 7px;
    padding: 13px;
    margin-bottom: 9px;
}

.track-title {
    display: flex;
    gap: 12px;
    align-items: baseline;
    margin-bottom: 8px;
}

.number {
    color: #987463;
    font-size: 13px;
    min-width: 25px;
}

.name {
    color: #3d2c25;
    font-size: 16px;
}


/* Custom Classic Audio Player */

.custom-player {
    width: 100%;
    height: 38px;

    background: #eee3d2;

    border: 1px solid #cbb89d;

    /* Fully rounded / capsule shape */
    border-radius: 999px;

    display: flex;
    align-items: center;

    padding: 0 10px;
    gap: 10px;
}

.play-button {
    width: 25px;
    height: 25px;

    border: 1px solid #9a7560;
    border-radius: 50%;

    background: #f3ead8;
    color: #713d35;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    padding: 0;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 11px;

    flex-shrink: 0;
}

.progress-container {
    flex: 1;
    height: 3px;

    background: #cbb89d;

    cursor: pointer;
    position: relative;

    border-radius: 999px;
}

.progress {
    height: 100%;
    width: 0%;

    background: #713d35;

    border-radius: 999px;
}

.time {
    color: #80604f;
    font-size: 11px;
    min-width: 75px;

    text-align: right;

    font-family: Georgia, "Times New Roman", serif;
}

/* Footer */

.footer {
    text-align: center;
    margin-top: 55px;
    padding-top: 25px;

    border-top: 1px solid #d5c5ad;

    color: #927666;
    font-size: 13px;
    line-height: 1.8;
}

/* Mobile */

@media (max-width: 600px) {

    .container {
        padding: 50px 14px 55px;
    }

    h1 {
        font-size: 27px;
    }

    .section-title {
        font-size: 19px;
    }

    .name {
        font-size: 15px;
    }

    .dedication {
        top: 14px;
        left: 15px;
        font-size: 9px;
    }

    .time {
        min-width: 70px;
        font-size: 10px;
    }

    .custom-player {
        gap: 8px;
        padding: 0 8px;
        border-radius: 999px;
    }

    .header {
        padding: 25px 18px 24px;
        border-width: 3px;
    }
}

</style>
</head>

<body>

<div class="dedication">
    From Hedgehog to Cactus <span class="star">☆</span>
</div>


<div class="container">

<header class="header">

    <div class="composer">
        Johann Sebastian Bach
    </div>

    <h1>
        Mass in B Minor
    </h1>

    <div class="subtitle">
        BWV 232
    </div>

    <div class="subtitle">
        Monteverdi Choir · English Baroque Soloists
    </div>

    <div class="subtitle gardiner">
        John Eliot Gardiner
    </div>

    <div class="year">
        2015
    </div>

    <div class="divider"></div>

</header>


<div id="music"></div>


<footer class="footer">

    J. S. Bach · Mass in B Minor, BWV 232<br>

    Monteverdi Choir · English Baroque Soloists<br>

    John Eliot Gardiner · 2015

</footer>

</div>


<script>

const tracks = [

    {
        number: "01",
        section: "Missa",
        subsection: "Kyrie",
        title: "Coro — Kyrie eleison",
        file: "Monteverdi Choir - Mass in B Minor_ BWV 232  Kyrie eleison.mp3"
    },

    {
        number: "02",
        section: "Missa",
        subsection: "Kyrie",
        title: "Duetto — Christe eleison",
        file: "Hannah Morrison - Mass in B Minor_ BWV 232  Christe eleison.mp3"
    },

    {
        number: "03",
        section: "Missa",
        subsection: "Kyrie",
        title: "Coro — Kyrie eleison II",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Kyrie_eleison_II.mp3"
    },

    {
        number: "04",
        section: "Missa",
        subsection: "Gloria",
        title: "Coro — Gloria in excelsis Deo",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Gloria_in_excelsis.mp3"
    },

    {
        number: "05",
        section: "Missa",
        subsection: "Gloria",
        title: "Aria — Laudamus te",
        file: "Hannah Morrison - Mass in B Minor_ BWV 232  Laudamus te.mp3"
    },

    {
        number: "06",
        section: "Missa",
        subsection: "Gloria",
        title: "Coro — Gratias agimus tibi",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Gratias_agimus_tibi.mp3"
    },

    {
        number: "07",
        section: "Missa",
        subsection: "Gloria",
        title: "Duetto — Domine Deus",
        file: "Hannah Morrison - Mass in B Minor_ BWV 232  Domine Deus.mp3"
    },

    {
        number: "08",
        section: "Missa",
        subsection: "Gloria",
        title: "Coro — Qui tollis peccata mundi",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Qui_tollis_peccata.mp3"
    },

    {
        number: "09",
        section: "Missa",
        subsection: "Gloria",
        title: "Aria — Qui sedes ad dextram Patris",
        file: "Esther_Brazil_Mass_in_B_Minor_BWV_232_Qui_sedes_ad_dextram_P.mp3"
    },

    {
        number: "10",
        section: "Missa",
        subsection: "Gloria",
        title: "Aria — Quoniam tu solus Sanctus",
        file: "David_Shipley_Mass_in_B_Minor_BWV_232_Quoniam_tu_solus_Sanct.mp3"
    },

    {
        number: "11",
        section: "Missa",
        subsection: "Gloria",
        title: "Coro — Cum Sancto Spiritu",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Cum_Sancto_Spiritu.mp3"
    },

    {
        number: "12",
        section: "Symbolum Nicenum",
        subsection: "Credo",
        title: "Coro — Credo in unum Deum",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Credo_in_unum_Deum.mp3"
    },

    {
        number: "13",
        section: "Symbolum Nicenum",
        subsection: "Credo",
        title: "Duetto — Et in unum Dominum",
        file: "Hannah_Morrison_Mass_in_B_Minor_BWV_232_Et_in_unum_Dominum.mp3"
    },

    {
        number: "14",
        section: "Symbolum Nicenum",
        subsection: "Credo",
        title: "Coro — Et incarnatus est",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Et_incarnatus_est.mp3"
    },

    {
        number: "15",
        section: "Symbolum Nicenum",
        subsection: "Credo",
        title: "Coro — Crucifixus",
        file: "Monteverdi Choir - Mass in B Minor_ BWV 232  Crucifixus.mp3"
    },

    {
        number: "16",
        section: "Symbolum Nicenum",
        subsection: "Credo",
        title: "Coro — Et resurrexit",
        file: "Monteverdi Choir - Mass in B Minor_ BWV 232  Et resurrexit.mp3"
    },

    {
        number: "17",
        section: "Symbolum Nicenum",
        subsection: "Credo",
        title: "Aria — Et in Spiritum Sanctum Dominum",
        file: "Alex_Ashworth_Mass_in_B_Minor_BWV_232_Et_in_Spiritum_Sanctum.mp3"
    },

    {
        number: "18",
        section: "Symbolum Nicenum",
        subsection: "Credo",
        title: "Coro — Confiteor unum baptisma",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Confiteor_unum_bapt.mp3"
    },

    {
        number: "19",
        section: "Symbolum Nicenum",
        subsection: "Credo",
        title: "Coro — Et expecto resurrectionem mortuorum",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Et_expecto_resurrec.mp3"
    },

    {
        number: "20",
        section: "Sanctus",
        subsection: "",
        title: "Coro — Sanctus",
        file: "Monteverdi Choir - Mass in B Minor_ BWV 232  Sanctus.mp3"
    },

    {
        number: "21",
        section: "Osanna, Benedictus, Agnus Dei Et Dona Nobis Pacem",
        subsection: "",
        title: "Coro — Osanna",
        file: "Monteverdi Choir - Mass in B Minor_ BWV 232  Osanna.mp3"
    },

    {
        number: "22",
        section: "Osanna, Benedictus, Agnus Dei Et Dona Nobis Pacem",
        subsection: "",
        title: "Aria — Benedictus",
        file: "Nick Pritchard - Mass in B Minor_ BWV 232  Benedictus.mp3"
    },

    {
        number: "23",
        section: "Osanna, Benedictus, Agnus Dei Et Dona Nobis Pacem",
        subsection: "",
        title: "Coro — Osanna Da capo",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Osanna_Da_capo.mp3"
    },

    {
        number: "24",
        section: "Osanna, Benedictus, Agnus Dei Et Dona Nobis Pacem",
        subsection: "",
        title: "Aria — Agnus Dei",
        file: "Meg Bragle - Mass in B Minor_ BWV 232  Agnus Dei.mp3"
    },

    {
        number: "25",
        section: "Osanna, Benedictus, Agnus Dei Et Dona Nobis Pacem",
        subsection: "",
        title: "Coro — Dona nobis pacem",
        file: "Monteverdi_Choir_Mass_in_B_Minor_BWV_232_Dona_nobis_pacem.mp3"
    }

];


const music = document.getElementById("music");

let currentSection = "";
let currentSubsection = "";
let currentSectionElement = null;


tracks.forEach(track => {

    if (track.section !== currentSection) {

        currentSection = track.section;
        currentSubsection = "";

        currentSectionElement = document.createElement("section");
        currentSectionElement.className = "section";

        const heading = document.createElement("h2");
        heading.className = "section-title";
        heading.textContent = track.section;

        currentSectionElement.appendChild(heading);
        music.appendChild(currentSectionElement);
    }


    if (
        track.subsection &&
        track.subsection !== currentSubsection
    ) {

        currentSubsection = track.subsection;

        const subheading = document.createElement("div");
        subheading.className = "subsection";
        subheading.textContent = track.subsection;

        currentSectionElement.appendChild(subheading);
    }


    const trackBox = document.createElement("div");
    trackBox.className = "track";


    const titleBox = document.createElement("div");
    titleBox.className = "track-title";


    const number = document.createElement("span");
    number.className = "number";
    number.textContent = track.number;


    const name = document.createElement("span");
    name.className = "name";
    name.textContent = track.title;


    titleBox.appendChild(number);
    titleBox.appendChild(name);


    const player = document.createElement("div");
    player.className = "custom-player";


    const audio = document.createElement("audio");
    audio.preload = "none";


    const source = document.createElement("source");
    source.src = encodeURI(track.file);
    source.type = "audio/mpeg";


    audio.appendChild(source);


    const playButton = document.createElement("button");
    playButton.className = "play-button";
    playButton.type = "button";
    playButton.textContent = "▶";


    const progressContainer = document.createElement("div");
    progressContainer.className = "progress-container";


    const progress = document.createElement("div");
    progress.className = "progress";

    progressContainer.appendChild(progress);


    const time = document.createElement("div");
    time.className = "time";
    time.textContent = "0:00 / 0:00";


    player.appendChild(playButton);
    player.appendChild(progressContainer);
    player.appendChild(time);
    player.appendChild(audio);


    playButton.addEventListener("click", () => {

        if (audio.paused) {
            audio.play();
        } else {
            audio.pause();
        }

    });


    audio.addEventListener("play", () => {
        playButton.textContent = "Ⅱ";
    });


    audio.addEventListener("pause", () => {
        playButton.textContent = "▶";
    });


    audio.addEventListener("loadedmetadata", () => {

        time.textContent =
            "0:00 / " + formatTime(audio.duration);

    });


    audio.addEventListener("timeupdate", () => {

        if (audio.duration) {

            const percentage =
                (audio.currentTime / audio.duration) * 100;

            progress.style.width = percentage + "%";

            time.textContent =
                formatTime(audio.currentTime) +
                " / " +
                formatTime(audio.duration);

        }

    });


    progressContainer.addEventListener("click", (event) => {

        if (!audio.duration) return;

        const rect =
            progressContainer.getBoundingClientRect();

        const position =
            (event.clientX - rect.left) / rect.width;

        audio.currentTime =
            position * audio.duration;

    });


    audio.addEventListener("ended", () => {

        playButton.textContent = "▶";
        progress.style.width = "0%";

    });


    function formatTime(seconds) {

        if (!isFinite(seconds)) return "0:00";

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");

        return minutes + ":" + secs;

    }


    trackBox.appendChild(titleBox);
    trackBox.appendChild(player);

    currentSectionElement.appendChild(trackBox);

});

</script>

</body>
</html>
